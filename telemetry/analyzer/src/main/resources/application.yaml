server:
  port: 8082
grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
spring:
  main:
    log-startup-info: false
    banner-mode: off

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_home_tech
    username: postgres
    password: admin
    driverClassName: org.postgresql.Driver

  sql:
    init:
      mode: always

kafka:
  snapshots:
    properties:
      bootstrap.servers: localhost:9092
      group.id: snapshot-analyzer

      key.deserializer: org.apache.kafka.common.serialization.VoidDeserializer
      value.deserializer: kafka.deserializer.SensorsSnapshotDeserializer

  hubs:
    properties:
      bootstrap.servers: localhost:9092
      group.id: hub-analyzer

      key.deserializer: org.apache.kafka.common.serialization.VoidDeserializer
      value.deserializer: kafka.deserializer.HubEventDeserializer