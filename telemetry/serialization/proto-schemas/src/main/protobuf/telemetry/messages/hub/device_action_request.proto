syntax = "proto3";

package telemetry.messages.hub;

import "telemetry/messages/hub/scenario/device_action.proto";
import "google/protobuf/timestamp.proto";

option java_package = "ru.yandex.practicum.grpc.telemetry.messages.hub";
option java_multiple_files = true;

message DeviceActionRequestProto {
  string hub_id = 1;
  string scenario_name = 2;
  telemetry.messages.hub.scenario.DeviceActionProto action = 3;
  google.protobuf.Timestamp timestamp = 4;
}